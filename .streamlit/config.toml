# The console is a light-clinical design: paper ground, near-black ink,
# hairline rules. Streamlit paints its own chrome - widgets, the sidebar, the
# dataframe - before any of our CSS lands, so the base theme has to agree or
# the first paint flashes dark and the widgets never match at all.
[theme]
base = "light"
primaryColor = "#1d4ed8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#fafafa"
textColor = "#09090b"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
