services:
  razorguard:
    build: .
    image: razorguard:latest
    ports:
      - "8000:8000"
    volumes:
      # State must outlive the container. Without this a redeploy is a blind
      # spot while baselines refill.
      - razorguard-state:/data
    environment:
      # One tick per minute in production. The detector's windows are counted
      # in ticks, so lowering this for a demo compresses its baselines too.
      RAZORGUARD_TICK_SECONDS: "60"
      # Authentication is required. Set one of these; the service refuses to
      # start otherwise, which is the correct default for an endpoint that
      # steers money decisions.
      RAZORGUARD_HMAC_KEY: "${RAZORGUARD_HMAC_KEY:?set RAZORGUARD_HMAC_KEY or RAZORGUARD_TOKEN in .env}"
      RAZORGUARD_ALERT_WEBHOOK: "${RAZORGUARD_ALERT_WEBHOOK:-}"
      RAZORGUARD_LOG_LEVEL: "INFO"
    restart: unless-stopped
    # Single replica by design - see the Dockerfile CMD.
    deploy:
      replicas: 1

  console:
    build: .
    image: razorguard:latest
    command: >
      streamlit run app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    ports:
      - "8501:8501"
    # The image's healthcheck probes the service on :8000. The console is a
    # different process on a different port, so it inherits a check it can
    # never pass and sits permanently unhealthy - which in an orchestrator is
    # a restart loop, not a cosmetic flag. Streamlit publishes its own.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  razorguard-state:
